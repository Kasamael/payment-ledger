name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Integration tests need a real PostgreSQL. Without it they would be skipped, not run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/ledger?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -count=1 -v ./...

      - name: Build
        run: go build ./...
