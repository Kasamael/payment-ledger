# Builds the arm64 image and hands the new tag to Kasamael/pi-deploy, which
# deploys it on the Raspberry Pi. Runs only after CI passed on main, and builds
# exactly the commit CI tested.
# Needs: Actions secret PI_DEPLOY_TOKEN (fine-grained PAT, only Kasamael/pi-deploy,
# Contents: Read and write); package ghcr.io/kasamael/payment-ledger →
# Manage Actions access → Kasamael/pi-deploy with Read.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: payment-ledger                       # folder name in pi-deploy/apps/
  IMAGE: ghcr.io/kasamael/payment-ledger    # lowercase

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kasamael/pi-deploy
          token: ${{ secrets.PI_DEPLOY_TOKEN }}
          path: pi-deploy
      - name: Bump image tag in pi-deploy
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE: ${{ github.repository }}@${{ needs.build.outputs.sha }}
        run: |
          cd pi-deploy
          echo "IMAGE_TAG=$TAG" > "apps/$APP/image.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/image.env"
          git commit -m "$APP: $TAG" -m "From $SOURCE" || { echo "Tag unchanged"; exit 0; }
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
