name: payment-ledger

services:
  postgres:
    image: mirror.gcr.io/library/postgres:17
    container_name: pl-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d ledger" ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ledger:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/ledger?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8095:8080"
    stop_grace_period: 15s

volumes:
  postgres_data: